[project]
name = "agroconnect-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.2",
    "pydantic==2.14.3",
    "SQLAlchemy==2.1.8",
    "starlette==1.10.0",
    "psycopg[binary]==3.3.8",
    "pytest==8.4.2",
    "httpx==0.28.1",
    "google-genai==2.23.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "numpy==2.5.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "integration: requer um PostgreSQL descartável configurado em TEST_TELEMETRY_DATABASE_URL",
]
